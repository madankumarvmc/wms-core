<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>WMS Core — Console</title>
	<link rel="stylesheet" href="/assets/sbx_wmslite/css/stackbox.css" />
	<link rel="stylesheet" href="/assets/sbx_wmslite/css/console.css" />
	<style>
		.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
		.kpi { background: var(--sb-card); border: 1px solid var(--sb-line); border-radius: var(--sb-radius);
			padding: 16px 18px; }
		.kpi .n { font-family: var(--sb-font-display, 'Oswald'); font-size: 34px; font-weight: 700; line-height: 1; }
		.kpi .l { color: var(--sb-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 6px; }
		.kpi.accent .n { color: var(--sb-orange); }
		.bar { height: 12px; background: var(--sb-line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
		.bar > i { display: block; height: 100%; background: var(--sb-orange); }
		table.grid { width: 100%; border-collapse: collapse; background: var(--sb-card); }
		table.grid th, table.grid td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--sb-line); font-size: 13px; }
		table.grid th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--sb-muted); }
		table.grid tr { cursor: default; }
		table.grid tr.click { cursor: pointer; }
		table.grid tr.click:hover { background: var(--sb-bg); }
		.pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; }
		.pill.open { background: var(--sb-blue-bg, #e9f1fb); color: var(--sb-blue, #2f6db5); }
		.pill.prog { background: var(--sb-amber-bg, #fdf2e0); color: var(--sb-amber, #b9770e); }
		.pill.appr { background: #f3e8fd; color: #7b3ff2; }
		.pill.done { background: var(--sb-green-bg, #e7f6ee); color: var(--sb-green, #1f9d57); }
		.pill.canc { background: #f1f3f5; color: #6b7280; }
		.scrim2 { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 60; }
		.scrim2.show { display: block; }
		.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 96vw); background: var(--sb-bg);
			box-shadow: -8px 0 24px rgba(0,0,0,.15); padding: 22px; overflow: auto; z-index: 61;
			transform: translateX(100%); transition: transform .25s; }
		.drawer.show { transform: translateX(0); }
		.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
		.toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid var(--sb-line); border-radius: var(--sb-radius-sm); }
		.sb-btn--inline { width: auto; flex: 0 0 auto; }
		/* segmented toggle (By Bin / By Coil, transaction source) */
		.seg { display: inline-flex; border: 1px solid var(--sb-line); border-radius: var(--sb-radius-sm); overflow: hidden; }
		.seg button { border: 0; background: var(--sb-card); padding: 8px 14px; font-size: 13px; cursor: pointer;
			border-right: 1px solid var(--sb-line); font-family: inherit; }
		.seg button:last-child { border-right: 0; }
		.seg button.on { background: var(--sb-orange); color: #fff; font-weight: 600; }
		/* pager under the big tables */
		.pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
		.pager button[disabled] { opacity: .4; cursor: not-allowed; }
	</style>
</head>
<body class="sb-body">
	<div class="app" style="display:grid;grid-template-columns:230px 1fr;min-height:100vh;">
		<aside class="sidebar" style="background:var(--sb-ink);color:#fff;padding:18px 14px;">
			<div style="display:flex;align-items:center;gap:8px;margin-bottom:24px;">
				<img src="/assets/sbx_wmslite/brand/stackbox-logo-white.svg" style="height:22px;" />
			</div>
			<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin-bottom:8px;">WMS Core</div>
			<nav id="nav"></nav>
			<a href="/wms-help" target="_blank" rel="noopener" style="display:block;margin-top:14px;padding:9px 12px;border-radius:8px;color:#fff;text-decoration:none;opacity:.7;font-size:13px;">? Help / Manual</a>
			<div class="foot">
				<div style="font-size:12px;opacity:.6;padding:0 12px 6px;">{{ full_name }}</div>
				<button class="logout" id="logout" type="button">Sign out</button>
			</div>
		</aside>
		<main style="padding:24px 28px;width:100%;min-width:0;">
			<h1 class="sb-display" id="view-title" style="margin:0 0 18px;">Dashboard</h1>
			<div id="content"></div>
		</main>
	</div>

	<div class="scrim2" id="scrim2" onclick="closeDrawer()"></div>
	<div class="drawer" id="drawer"></div>

	<script>
		const CSRF = "{{ csrf_token }}";
		window.WMS_CSRF = CSRF; // exposed for E2E seeding helpers
		const $ = (id) => document.getElementById(id);
		const CAN_USERS = {{ can_manage_users or 0 }};   // WMS Manager / System Manager
		const VIEWS = [["dashboard", "Dashboard"], ["trucks", "Trucks"], ["inventory", "Inventory"], ["transactions", "Scan Transactions"], ["confirmations", "SAP Confirmations"], ["saploading", "SAP Loading"], ["saplog", "SAP Log"], ["import", "Import"]]
			.concat(CAN_USERS ? [["users", "Users"]] : []);
		const GI_PILL = { "Confirmed": "done", "Pending": "open", "Held": "appr", "Sending": "prog", "Failed (Retryable)": "prog", "Failed (Business)": "canc", "Exhausted": "canc", "Not Required": "canc" };
		const T1_PILL = { "Sent": "done", "Pending": "open", "Failed": "canc", "Not Required": "canc" };
		let state = { view: "dashboard" };

		async function api(method, args) {
			const res = await fetch("/api/method/" + method, {
				method: "POST", headers: { "Content-Type": "application/json", "X-Frappe-CSRF-Token": CSRF },
				body: JSON.stringify(args || {}),
			});
			if (!res.ok) {
				let m = "Error " + res.status;
				try { const j = await res.json(); m = (j._server_messages ? JSON.parse(j._server_messages).map(x => JSON.parse(x).message).join("\n") : j.message) || m; } catch (e) {}
				throw new Error(m);
			}
			return (await res.json()).message;
		}
		const esc = (s) => (s == null ? "" : String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])));
		const pill = (st) => {
			const m = { "Open": "open", "In Progress": "prog", "Pending Approval": "appr", "Completed": "done", "Completed (Short)": "done", "Cancelled": "canc" };
			return '<span class="pill ' + (m[st] || "open") + '">' + esc(st) + '</span>';
		};
		// ---- date range helpers (default: last 7 days) ----
		const isoDate = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
		function defaultRange() { const to = new Date(); const from = new Date(); from.setDate(to.getDate() - 6); return { from: isoDate(from), to: isoDate(to) }; }
		function dateControls(p, r) {
			return '<label style="font-size:12px;color:var(--sb-muted);">From <input type="date" id="' + p + '-from" value="' + r.from + '"></label>' +
				'<label style="font-size:12px;color:var(--sb-muted);">To <input type="date" id="' + p + '-to" value="' + r.to + '"></label>' +
				'<button class="sb-btn sb-btn--ghost sb-btn--inline" id="' + p + '-clear" style="padding:6px 10px;font-size:12px;">All time</button>';
		}
		const rangeArgs = (p) => ({ date_from: $(p + "-from").value || null, date_to: $(p + "-to").value || null });

		// ---- Excel export ----
		// The server re-runs the same query the screen ran (minus the on-screen page
		// limit), so the file always matches the filters that are showing.
		function apiUrl(method, args) {
			const p = new URLSearchParams();
			Object.keys(args || {}).forEach((k) => {
				const v = args[k];
				if (v !== null && v !== undefined && v !== "") p.append(k, v);
			});
			const qs = p.toString();
			return "/api/method/" + method + (qs ? "?" + qs : "");
		}
		const exportUrl = (view, args) => apiUrl("sbx_wmslite.console_api.export_view", Object.assign({ view: view }, args || {}));
		const exportBtn = (id) => '<button class="sb-btn sb-btn--ghost sb-btn--inline" id="' + id +
			'" title="Download these rows as an Excel file" style="padding:6px 10px;font-size:12px;">\u2b07 Excel</button>';

		// Fetched as a blob rather than navigated to: a server-side error on a plain
		// link would replace the whole console with Frappe's error page.
		async function downloadExport(btn, url) {
			const label = btn.textContent;
			btn.disabled = true; btn.textContent = "Preparing\u2026";
			try {
				const res = await fetch(url, { headers: { "X-Frappe-CSRF-Token": CSRF } });
				const ctype = res.headers.get("Content-Type") || "";
				if (!res.ok || ctype.indexOf("json") >= 0) {
					let m = "Export failed (" + res.status + ")";
					try { const j = await res.json(); m = (j._server_messages ? JSON.parse(j._server_messages).map(x => JSON.parse(x).message).join("\n") : (j.message || j.exception)) || m; } catch (e) { }
					throw new Error(m);
				}
				const blob = await res.blob();
				const cd = res.headers.get("Content-Disposition") || "";
				const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
				const a = document.createElement("a");
				a.href = URL.createObjectURL(blob);
				a.download = m ? decodeURIComponent(m[1]) : "wmslite_export.xlsx";
				document.body.appendChild(a); a.click(); a.remove();
				setTimeout(() => URL.revokeObjectURL(a.href), 5000);
			} catch (e) { alert(e.message || "Export failed"); }
			finally { btn.disabled = false; btn.textContent = label; }
		}
		// The URL is built at click time, not render time, so the file follows the
		// filters as they stand when the button is pressed.
		function onExport(id, urlFn) {
			const b = $(id);
			if (b) b.onclick = () => downloadExport(b, urlFn());
		}

		function renderNav() {
			$("nav").innerHTML = VIEWS.map(([k, label]) =>
				'<a class="nav-item" data-v="' + k + '" style="display:block;padding:9px 12px;border-radius:8px;color:#fff;text-decoration:none;margin-bottom:3px;' +
				(state.view === k ? "background:var(--sb-orange);font-weight:700;" : "opacity:.85;") + '">' + label + '</a>').join("");
			document.querySelectorAll(".nav-item").forEach((a) => a.onclick = () => navigate(a.dataset.v));
		}
		function navigate(v) { state.view = v; renderNav(); $("view-title").textContent = VIEWS.find(x => x[0] === v)[1]; render(); }

		async function render() {
			const c = $("content"); c.innerHTML = '<p class="sb-muted">Loading…</p>';
			try {
				if (state.view === "dashboard") return renderDashboard(c);
				if (state.view === "trucks") return renderTrucks(c);
				if (state.view === "inventory") return renderInventory(c);
				if (state.view === "confirmations") return renderConfirmations(c);
				if (state.view === "saploading") return renderSapLoading(c);
				if (state.view === "saplog") return renderSapLog(c);
				if (state.view === "import") return renderImport(c);
				if (state.view === "transactions") return renderTransactions(c);
				if (state.view === "users") return renderUsers(c);
			} catch (e) { c.innerHTML = '<p style="color:#a23b2e;">' + esc(e.message) + '</p>'; }
		}

		// ---------- dashboard ----------
		async function renderDashboard(c) {
			const r = state.dashRange || defaultRange();
			c.innerHTML =
				'<div class="toolbar">' + dateControls("db", r) + '<span style="flex:1;"></span>' + exportBtn("db-x") + '</div>' +
				'<div class="sb-label" style="margin:2px 0 6px;">Now</div>' +
				'<div class="kpis" id="db-live"></div>' +
				'<div class="sb-label" style="margin:16px 0 6px;">Throughput <span id="db-range" class="sb-muted" style="font-weight:400;text-transform:none;letter-spacing:0;"></span></div>' +
				'<div class="kpis" id="db-thru"></div>' +
				'<div class="sb-label" style="margin:16px 0 6px;">Inventory on hand</div>' +
				'<div class="kpis" id="db-inv"></div>' +
				'<div class="sb-label" style="margin:16px 0 6px;">Scan activity <span id="db-range2" class="sb-muted" style="font-weight:400;text-transform:none;letter-spacing:0;"></span></div>' +
				'<div class="kpis" id="db-scans"></div>' +
				'<div id="db-scanfoot" class="sb-muted" style="font-size:12px;margin-top:6px;"></div>' +
				'<div class="sb-card" id="db-overall" style="padding:18px;margin-top:18px;"></div>';
			const load = async () => {
				const ra = rangeArgs("db");
				state.dashRange = { from: ra.date_from || "", to: ra.date_to || "" };
				const d = await api("sbx_wmslite.console_api.get_dashboard", ra);
				$("db-live").innerHTML =
					kpi(d.live.open, "Open / Active", true) + kpi(d.live.pending_approval, "Awaiting Approval") +
					kpi(d.live.gi_awaiting_release, "GI Awaiting Release") + kpi(d.live.gi_failed, "GI Failed");
				const rangeLabel = (ra.date_from && ra.date_to) ? ("· " + ra.date_from + " → " + ra.date_to) : "· all time";
				$("db-range").textContent = rangeLabel;
				$("db-range2").textContent = rangeLabel;
				$("db-thru").innerHTML =
					kpi(d.throughput.completed, "Completed") + kpi(d.throughput.coils_loaded, "Coils Loaded") + kpi(d.throughput.rejects, "Rejects");
				// inventory is deliberately NOT range-scoped — stock on hand is "now"
				$("db-inv").innerHTML =
					kpi(fmt(d.inventory.coils), "Coils in Stock", true) + kpi(fmt(d.inventory.bins), "Bins Occupied") +
					kpi(fmt(Math.round(d.inventory.weight)), "Total Weight") + kpi(fmt(d.inventory.picked), "Picked");
				$("db-scans").innerHTML =
					kpi(fmt(d.scans.total), "Scans") + kpi(fmt(d.scans.sap_feed), "From SAP Feed") +
					kpi(fmt(d.scans.in_app), "Inventory Count") + kpi(fmt(d.scans.coils), "Coils Touched");
				$("db-scanfoot").innerHTML =
					(d.scans.last_scan ? "Last scan " + esc(d.scans.last_scan.slice(0, 19)) : "No scans in range") +
					(d.scans.unprocessed ? ' · <b style="color:#a23b2e;">' + d.scans.unprocessed + ' unprocessed</b> — open Transactions to derive them' : " · all scans derived");
				$("db-overall").innerHTML =
					'<div class="sb-label">Overall coil progress' + ((ra.date_from && ra.date_to) ? " (plans received in range)" : "") + '</div>' +
					'<div class="bar"><i style="width:' + d.coils.progress_pct + '%"></i></div>' +
					'<p class="sb-muted" style="margin-top:8px;">' + d.coils.loaded + ' loaded · ' + d.coils.skipped + ' skipped · ' + d.coils.pending + ' pending</p>';
			};
			$("db-from").onchange = load; $("db-to").onchange = load;
			onExport("db-x", () => apiUrl("sbx_wmslite.console_api.export_dashboard", rangeArgs("db")));
			$("db-clear").onclick = () => { $("db-from").value = ""; $("db-to").value = ""; load(); };
			load();
		}
		const kpi = (n, l, accent) => '<div class="kpi' + (accent ? " accent" : "") + '"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>';
		// 53130 -> "53,130". These views deal in tens of thousands; raw digits are unreadable.
		const fmt = (n) => (n === null || n === undefined || n === "") ? "0" : Number(n).toLocaleString("en-IN");

		// Placeholder while a query is in flight, so stale rows are never mistaken
		// for the new filter's result.
		function busy(tableId, pagerId) {
			const t = $(tableId); if (t) t.innerHTML = '<p class="sb-muted" style="padding:14px 0;">Loading…</p>';
			const p = pagerId && $(pagerId); if (p) p.innerHTML = "";
		}

		// ---------- shared pager ----------
		// Server-side paging for the big tables (53k coils / 260k transactions).
		// Renders "showing X-Y of Z" + Prev/Next; onGo(newStart) reloads that page.
		function pager(id, d, onGo) {
			const start = d.start || 0, limit = d.limit || 50, total = d.total || 0;
			const from = total ? start + 1 : 0, to = Math.min(start + limit, total);
			const el = $(id);
			if (!el) return;
			el.innerHTML =
				'<span class="sb-muted" style="font-size:13px;">Showing ' + fmt(from) + '–' + fmt(to) + ' of ' + fmt(total) + '</span>' +
				'<span style="flex:1;"></span>' +
				'<button class="sb-btn sb-btn--ghost sb-btn--inline" id="' + id + '-prev"' + (start <= 0 ? " disabled" : "") + '>‹ Prev</button>' +
				'<button class="sb-btn sb-btn--ghost sb-btn--inline" id="' + id + '-next"' + (to >= total ? " disabled" : "") + '>Next ›</button>';
			$(id + "-prev").onclick = () => onGo(Math.max(0, start - limit));
			$(id + "-next").onclick = () => onGo(start + limit);
		}

		// ---------- trucks ----------
		async function renderTrucks(c) {
			const r = defaultRange();
			c.innerHTML =
				'<div class="toolbar"><input id="t-q" placeholder="Search truck…" />' +
				'<select id="t-status"><option value="">All statuses</option>' +
				['Open', 'In Progress', 'Pending Approval', 'Completed', 'Completed (Short)', 'Cancelled'].map(s => '<option>' + s + '</option>').join("") +
				'</select>' + dateControls("t", r) + '<span style="flex:1;"></span>' + exportBtn("t-x") +
				'</div><div id="t-table"></div>';
			const load = async () => {
				const rows = await api("sbx_wmslite.console_api.get_trucks", { q: $("t-q").value, status: $("t-status").value, ...rangeArgs("t") });
				$("t-table").innerHTML = '<table class="grid"><thead><tr><th>Truck</th><th>Status</th><th>GI</th><th>Source</th><th>Loaded</th><th>Pending</th><th>Total</th><th>Claimed</th></tr></thead><tbody>' +
					(rows.length ? rows.map(r =>
						'<tr class="click" data-p="' + esc(r.name) + '"><td><b>' + esc(r.truck_number) + '</b></td><td>' + pill(r.plan_status) +
						'</td><td><span class="pill ' + (GI_PILL[r.gi_status] || "canc") + '">' + esc(r.gi_status || "—") + '</span></td><td>' + esc(r.source) +
						'</td><td>' + r.loaded_coils + '</td><td>' + r.pending_coils + '</td><td>' + r.total_coils + '</td><td>' + esc(r.claimed_by || "—") + '</td></tr>'
					).join("") : '<tr><td colspan="8" class="sb-muted">No trucks</td></tr>') + '</tbody></table>';
				document.querySelectorAll("#t-table tr.click").forEach(tr => tr.onclick = () => truckDrawer(tr.dataset.p));
			};
			onExport("t-x", () => exportUrl("trucks", { q: $("t-q").value, status: $("t-status").value, ...rangeArgs("t") }));
			$("t-q").oninput = () => { clearTimeout(window._td); window._td = setTimeout(load, 300); };
			$("t-status").onchange = load;
			$("t-from").onchange = load; $("t-to").onchange = load;
			$("t-clear").onclick = () => { $("t-from").value = ""; $("t-to").value = ""; load(); };
			load();
		}

		async function truckDrawer(plan) {
			const d = await api("sbx_wmslite.console_api.get_truck_detail", { plan });
			const p = d.plan;
			openDrawer(
				'<div style="display:flex;align-items:center;"><h2 class="sb-h1" style="margin:0;flex:1;">' + esc(p.truck_number) + '</h2>' + pill(p.plan_status) + '</div>' +
				'<p class="sb-muted">' + esc(p.name) + ' · ' + esc(p.source) + (p.sap_plan_id ? ' · SAP ' + esc(p.sap_plan_id) : '') + '</p>' +
				'<div class="row" style="display:flex;gap:8px;margin:12px 0;">' +
				(p.plan_status === "Ready to Complete" ? '<button class="sb-btn sb-btn--primary sb-btn--inline" id="d-complete">Complete loading</button>' : '') +
				(p.plan_status !== "Cancelled" ? '<button class="sb-btn sb-btn--ghost sb-btn--inline" id="d-cancel">Cancel plan</button>' : '<button class="sb-btn sb-btn--ghost sb-btn--inline" id="d-reopen">Reopen</button>') +
				exportBtn("d-x") +
				'</div>' +
				'<div class="sb-label" style="margin-top:8px;">Coils (' + p.loaded_coils + '/' + p.total_coils + ' loaded)</div>' +
				'<table class="grid"><thead><tr><th>Coil</th><th>Status</th><th>Grade</th><th>By</th><th>SAP T1</th></tr></thead><tbody>' +
				d.coils.map(c => {
					const t1 = c.sap_loading_status
						? '<span class="pill ' + (T1_PILL[c.sap_loading_status] || "canc") + '" title="' + esc(c.sap_loading_message || "") + '">' + esc(c.sap_loading_status) + '</span>' +
							(c.sap_loading_status === "Failed" ? ' <button class="sb-btn sb-btn--orange sb-btn--inline" style="padding:4px 9px;font-size:11px;" data-t1retry="' + esc(c.name) + '">Retry</button>' : '')
						: '<span class="sb-muted">—</span>';
					return '<tr><td>' + esc(c.coil_barcode) + (c.unplanned ? ' <span class="sb-muted">(unplanned)</span>' : '') + '</td><td>' + esc(c.coil_status) +
						(c.skip_reason ? ' <span class="sb-muted">(' + esc(c.skip_reason) + ')</span>' : '') + '</td><td>' + esc(c.material_grade || "") + '</td><td>' + esc(c.loaded_by || "—") + '</td><td style="white-space:nowrap;">' + t1 + '</td></tr>';
				}).join("") +
				'</tbody></table>' +
				'<div class="sb-label" style="margin-top:18px;">Events</div>' +
				'<table class="grid"><thead><tr><th>Time</th><th>Event</th><th>Coil</th><th>Operator</th><th>Detail</th></tr></thead><tbody>' +
				d.events.map(e => '<tr><td style="white-space:nowrap;">' + esc((e.event_time || "").slice(0, 19)) + '</td><td>' + esc(e.event_type) + (e.result === "Rejected" ? ' ✗' : '') +

		// ---------- import wizard ----------
		let imp = {};
		// ---------- Bin Inventory display ----------
		// Two modes: "bin" (rollup, default — 760 bins beats 53k coils) and "coil".
		// q/status live in state so switching mode keeps what you already typed.
		let INV = { mode: "bin", start: 0, q: "", status: "" };
		async function renderInventory(c) {
			c.innerHTML = '<div class="toolbar">' +
				'<div class="seg" id="bi-seg">' +
				'<button data-mode="bin" class="' + (INV.mode === "bin" ? "on" : "") + '">By Bin</button>' +
				'<button data-mode="coil" class="' + (INV.mode === "coil" ? "on" : "") + '">By Coil</button></div>' +
				'<input id="bi-q" placeholder="Coil or bin starts with…" value="' + esc(INV.q) + '" />' +
				'<select id="bi-status"><option value="">All statuses</option><option>Available</option><option>Picked</option><option>Blocked</option></select>' +
				'<span style="flex:1;"></span>' + exportBtn("bi-x") +
				'</div><div id="bi-table"></div><div class="pager" id="bi-pg"></div>';
			$("bi-status").value = INV.status;

			let seq = 0;   // drop a stale response that lands after a newer one
			const loadBins = async () => {
				const mine = ++seq;
				busy("bi-table", "bi-pg");
				const d = await api("sbx_wmslite.console_api.get_bin_rollup", { q: $("bi-q").value, start: INV.start });
				if (mine !== seq) return;
				$("bi-table").innerHTML = '<table class="grid"><thead><tr><th>Bin</th><th>Coils</th><th>Weight</th><th>Picked</th><th>Last Updated</th><th></th></tr></thead><tbody>' +
					(d.rows.length ? d.rows.map(r => '<tr><td><b>' + esc(r.bin_code) + '</b></td><td>' + fmt(r.coils) + '</td><td>' + fmt(Math.round(r.weight || 0)) +
						'</td><td>' + fmt(r.picked || 0) + '</td><td class="sb-muted">' + esc((r.last_updated || "").slice(0, 19)) +
						'</td><td><button class="sb-btn sb-btn--ghost sb-btn--inline" data-bin="' + esc(r.bin_code) + '">View coils</button></td></tr>').join("") :
						'<tr><td colspan="6" class="sb-muted">No bin inventory yet — push it or import via the Import tab.</td></tr>') + '</tbody></table>';
				pager("bi-pg", d, (s) => { INV.start = s; loadBins(); });
				$("bi-table").querySelectorAll("button[data-bin]").forEach(b => { b.onclick = () => binDrawer(b.dataset.bin); });
			};

			const loadCoils = async () => {
				const mine = ++seq;
				busy("bi-table", "bi-pg");
				const d = await api("sbx_wmslite.console_api.get_bin_inventory",
					{ q: $("bi-q").value, status: $("bi-status").value, start: INV.start });
				if (mine !== seq) return;
				$("bi-table").innerHTML = '<table class="grid"><thead><tr><th>Bin</th><th>Coil</th><th>Grade</th><th>Weight</th><th>Status</th><th>Source</th><th>Updated</th></tr></thead><tbody>' +
					(d.rows.length ? d.rows.map(r => '<tr><td><b>' + esc(r.bin_code) + '</b></td><td>' + esc(r.coil_barcode) + '</td><td>' + esc(r.material_grade || "") +
						'</td><td>' + (r.weight || "") + '</td><td>' + esc(r.status || "") +
						'</td><td class="sb-muted">' + esc(r.source || "") + '</td><td class="sb-muted">' + esc((r.updated_at || "").slice(0, 19)) + '</td></tr>').join("") :
						'<tr><td colspan="7" class="sb-muted">No coils match.</td></tr>') + '</tbody></table>';
				pager("bi-pg", d, (s) => { INV.start = s; loadCoils(); });
			};

			const load = () => (INV.mode === "bin" ? loadBins() : loadCoils());
			$("bi-seg").querySelectorAll("button").forEach(b => {
				b.onclick = () => { INV.mode = b.dataset.mode; INV.start = 0; renderInventory(c); };
			});
			// status only applies to coil rows; hide it on the rollup to avoid a dead control
			$("bi-status").style.display = INV.mode === "coil" ? "" : "none";
			// exports whichever mode is on screen — rollup rows or coil rows
			onExport("bi-x", () => exportUrl(INV.mode === "bin" ? "inventory_bin" : "inventory_coil",
				{ q: $("bi-q").value, status: INV.mode === "coil" ? $("bi-status").value : "" }));
			$("bi-q").oninput = () => { clearTimeout(window._bid); window._bid = setTimeout(() => { INV.q = $("bi-q").value; INV.start = 0; load(); }, 300); };
			$("bi-status").onchange = () => { INV.status = $("bi-status").value; INV.start = 0; load(); };
			load();
		}

		// ---------- scan transactions (the append-only Coil Transaction feed) ----------
		// 260k+ rows shared by two very different populations, so the source toggle
		// is the primary control: "SAP Feed" vs "Inventory Count" answer different questions.
		// q/date range live in state: switching the source toggle re-renders the
		// toolbar, and rebuilding it from defaultRange() would silently throw away
		// the range and search the user had already set.
		let TXN = { source: "", start: 0, unprocessed: 0, q: "", range: null };
		async function renderTransactions(c) {
			const r = TXN.range || defaultRange();
			c.innerHTML = '<div class="toolbar">' +
				'<div class="seg" id="tx-seg">' +
				'<button data-src="" class="' + (TXN.source === "" ? "on" : "") + '">All</button>' +
				'<button data-src="Push API" class="' + (TXN.source === "Push API" ? "on" : "") + '">SAP Feed</button>' +
				'<button data-src="In-app" class="' + (TXN.source === "In-app" ? "on" : "") + '">Inventory Count</button>' +
				'</div>' +
				'<input id="tx-q" placeholder="Coil or bin starts with…" value="' + esc(TXN.q) + '" />' +
				dateControls("tx", r) +
				'<label class="sb-muted" style="font-size:13px;display:flex;gap:6px;align-items:center;">' +
				'<input type="checkbox" id="tx-unproc"' + (TXN.unprocessed ? " checked" : "") + ' /> Unprocessed only</label>' +
				'<span style="flex:1;"></span>' +
				'<button class="sb-btn sb-btn--ghost sb-btn--inline" id="tx-reproc">Reprocess pending</button>' +
				exportBtn("tx-x") +
				'</div>' +
				'<div class="kpis" id="tx-kpis" style="margin-bottom:14px;"></div>' +
				'<div id="tx-table"></div><div class="pager" id="tx-pg"></div>';

			// Guards against a slow "All time" aggregate (~2s over 260k rows) leaving
			// the previous result on screen — that reads as "the filter did nothing".
			// The seq check also drops a stale response that lands after a newer one.
			let seq = 0;
			const load = async () => {
				const mine = ++seq;
				const ra = rangeArgs("tx");
				busy("tx-table", "tx-pg");
				const d = await api("sbx_wmslite.console_api.get_coil_transactions", Object.assign({
					q: $("tx-q").value, source: TXN.source, start: TXN.start,
					unprocessed: $("tx-unproc").checked ? 1 : 0,
				}, ra));
				if (mine !== seq) return;   // a newer request already answered
				$("tx-kpis").innerHTML =
					kpi(fmt(d.stats.total), "Scans in Range", true) + kpi(fmt(d.stats.sap_feed), "From SAP Feed") +
					kpi(fmt(d.stats.in_app), "Inventory Count") + kpi(fmt(d.stats.unprocessed), "Unprocessed");
				$("tx-table").innerHTML = '<table class="grid"><thead><tr><th>Scanned At</th><th>Coil</th><th>Bin</th><th>Type</th><th>Source</th><th>By</th><th>Weight</th><th>QC</th><th></th></tr></thead><tbody>' +
					(d.rows.length ? d.rows.map(r => '<tr class="click" data-txn="' + esc(r.name) + '">' +
						'<td>' + esc((r.scanned_at || "").slice(0, 19)) + '</td><td><b>' + esc(r.coil_barcode || "") + '</b></td>' +
						'<td>' + esc(r.bin_code || "—") + '</td><td>' + esc(r.transaction_type || "—") + '</td>' +
						'<td class="sb-muted">' + esc(r.source || "") + '</td><td class="sb-muted">' + esc(r.username || "—") + '</td>' +
						'<td>' + (r.weight || "") + '</td><td>' + esc(r.qc || "—") + '</td>' +
						'<td class="sb-muted">' + (r.processed ? "" : "pending") + '</td></tr>').join("") :
						'<tr><td colspan="9" class="sb-muted">No scans in this range. Widen the dates or clear the filters.</td></tr>') + '</tbody></table>';
				pager("tx-pg", d, (s) => { TXN.start = s; load(); });
				$("tx-table").querySelectorAll("tr[data-txn]").forEach(tr => { tr.onclick = () => txnDrawer(tr.dataset.txn); });
			};

			$("tx-seg").querySelectorAll("button").forEach(b => {
				b.onclick = () => { TXN.source = b.dataset.src; TXN.start = 0; renderTransactions(c); };
			});
			onExport("tx-x", () => exportUrl("transactions", Object.assign({
				q: $("tx-q").value, source: TXN.source,
				unprocessed: $("tx-unproc").checked ? 1 : 0,
			}, rangeArgs("tx"))));
			const keepRange = () => { TXN.range = { from: $("tx-from").value, to: $("tx-to").value }; };
			$("tx-q").oninput = () => { clearTimeout(window._txd); window._txd = setTimeout(() => { TXN.q = $("tx-q").value; TXN.start = 0; load(); }, 300); };
			$("tx-from").onchange = () => { keepRange(); TXN.start = 0; load(); };
			$("tx-to").onchange = () => { keepRange(); TXN.start = 0; load(); };
			$("tx-clear").onclick = () => { $("tx-from").value = ""; $("tx-to").value = ""; keepRange(); TXN.start = 0; load(); };
			$("tx-unproc").onchange = () => { TXN.unprocessed = $("tx-unproc").checked ? 1 : 0; TXN.start = 0; load(); };
			$("tx-reproc").onclick = async () => {
				const b = $("tx-reproc"); b.disabled = true; b.textContent = "Deriving…";
				try {
					const r = await api("sbx_wmslite.console_api.reprocess_transactions");
					alert(r.processed ? ("Derived " + r.processed + " scan(s) into Bin Inventory; " + r.remaining + " still pending.")
									  : "Nothing pending — every scan is already derived.");
				} catch (e) { alert(e.message); }
				finally { b.disabled = false; b.textContent = "Reprocess pending"; load(); }
			};
			load();
		}

		async function txnDrawer(name) {

			const d = await api("sbx_wmslite.console_api.get_transaction_detail", { name: name });

			openDrawer('<h2 class="sb-h1" style="margin:0 0 4px;">' + esc(d.coil_barcode || "Scan") + '</h2>' +
				'<p class="sb-muted">' + esc((d.scanned_at || "").slice(0, 19)) + ' · ' + esc(d.source || "") + '</p>' +
				'<table class="grid" style="margin-top:12px;"><tbody>' +

				row("Bin Inventory", d.bin_inventory) + row("Idempotency key", d.txn_key) +
				'</tbody></table>' +
				(raw ? '<div class="sb-label" style="margin:16px 0 6px;">Raw payload</div>' +
					'<pre style="background:#f5f5f6;border:1px solid var(--sb-line);border-radius:6px;padding:12px;font-size:12px;overflow:auto;max-height:320px;">' + esc(raw) + '</pre>' : "") +
				'<div class="row" style="display:flex;gap:8px;margin-top:18px;"><button class="sb-btn sb-btn--ghost sb-btn--inline" onclick="closeDrawer()">Close</button></div>');
		}

		async function binDrawer(bin) {
			openDrawer('<h2 class="sb-h1" style="margin:0 0 4px;">' + esc(bin) + '</h2><p class="sb-muted">Loading coils…</p>');
			const d = await api("sbx_wmslite.console_api.get_bin_inventory", { bin_code: bin, limit: 200 });
			openDrawer('<h2 class="sb-h1" style="margin:0 0 4px;">' + esc(bin) + '</h2>' +
				'<p class="sb-muted">' + fmt(d.total) + ' coil(s) in this bin</p>' +
				'<table class="grid" style="margin-top:12px;"><thead><tr><th>Coil</th><th>Grade</th><th>Weight</th><th>Zone/Aisle</th><th>Status</th><th>Updated</th></tr></thead><tbody>' +
				d.rows.map(r => '<tr><td><b>' + esc(r.coil_barcode) + '</b></td><td>' + esc(r.material_grade || "") + '</td><td>' + (r.weight || "") +
					'</td><td>' + esc([r.zone, r.aisle].filter(Boolean).join(" / ") || "—") + '</td><td>' + esc(r.status || "") +
					'</td><td class="sb-muted">' + esc((r.updated_at || "").slice(0, 19)) + '</td></tr>').join("") +
				'</tbody></table>' +
				(d.total > d.rows.length ? '<p class="sb-muted" style="margin-top:10px;">Showing first ' + d.rows.length + ' — search the bin in By Coil for the rest.</p>' : "") +
				'<div class="row" style="display:flex;gap:8px;margin-top:18px;"><button class="sb-btn sb-btn--ghost sb-btn--inline" onclick="closeDrawer()">Close</button></div>');
		}

		const IMPORT_DATASETS = ["Loading Plan", "Bin Inventory"];
		async function renderImport(c) {
			imp = { dataset: "Loading Plan" };
			const help = {
				"Loading Plan": "One row per coil. Required: <b>truck_number</b>, <b>coil_barcode</b>. Optional: sap_plan_id, material_grade, weight.",
				"Bin Inventory": "One row per coil. Required: <b>coil_barcode</b>, <b>bin_code</b>. Optional: material_grade, weight, zone, aisle.",
			};
			c.innerHTML =
				'<div class="sb-card" style="padding:20px;max-width:620px;">' +
				'<div class="sb-label">Upload</div><h2 class="sb-h2" style="margin:.2em 0 .6em;">Import data</h2>' +
				'<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"><label style="font-size:13px;">Dataset</label>' +
				'<select id="imp-dataset">' + IMPORT_DATASETS.map(d => '<option' + (d === imp.dataset ? " selected" : "") + '>' + d + '</option>').join("") + '</select></div>' +
				'<p class="sb-muted" id="imp-help">' + help[imp.dataset] + '</p>' +
				'<a class="sb-btn sb-btn--ghost sb-btn--inline" id="imp-tpl" style="display:inline-block;margin-bottom:12px;">⬇ Download template</a>' +
				'<div style="height:6px;"></div>' +
				'<input type="file" id="imp-file" accept=".csv,.xlsx" style="margin:12px 0;" />' +
				'<div id="imp-out"></div></div>';
			const tplLink = () => $("imp-tpl").setAttribute("href", "/api/method/sbx_wmslite.console_api.get_import_template?dataset=" + encodeURIComponent(imp.dataset));
			tplLink();
			$("imp-dataset").onchange = (e) => { imp.dataset = e.target.value; $("imp-help").innerHTML = help[imp.dataset]; tplLink(); $("imp-out").innerHTML = ""; };
			$("imp-file").onchange = uploadFile;
		}
		async function uploadFile(e) {
			const file = e.target.files[0]; if (!file) return;
			const out = $("imp-out"); out.innerHTML = '<p class="sb-muted">Uploading…</p>';
			const fd = new FormData(); fd.append("file", file); fd.append("is_private", 1);
			const up = await fetch("/api/method/upload_file", { method: "POST", headers: { "X-Frappe-CSRF-Token": CSRF }, body: fd });
			const uj = await up.json(); imp.file_url = uj.message.file_url; imp.file_name = file.name;
			const p = await api("sbx_wmslite.console_api.parse_upload", { file_url: imp.file_url, dataset: imp.dataset });
			imp.mapping = p.suggested_mapping || {};
			out.innerHTML = '<div class="sb-label" style="margin-top:8px;">Map columns</div>' +
				p.columns.map(col => '<div style="display:flex;gap:8px;align-items:center;margin:6px 0;"><label style="width:130px;font-size:13px;">' + col + (p.required.includes(col) ? ' *' : '') + '</label>' +
					'<select data-col="' + col + '"><option value="">— none —</option>' + p.headers.map(h => '<option ' + (imp.mapping[col] === h ? "selected" : "") + '>' + esc(h) + '</option>').join("") + '</select></div>').join("") +
				'<p class="sb-muted">' + p.total_rows + ' data rows.</p>' +
				'<button class="sb-btn sb-btn--primary" id="imp-preview" style="margin-top:8px;">Preview</button><div id="imp-prev"></div>';
			$("imp-preview").onclick = previewImport;
		}
		function readMapping() { const m = {}; document.querySelectorAll("#imp-out select[data-col]").forEach(s => { if (s.value) m[s.dataset.col] = s.value; }); return m; }
		async function previewImport() {
			imp.mapping = readMapping();
			const r = await api("sbx_wmslite.console_api.import_preview", { file_url: imp.file_url, mapping: JSON.stringify(imp.mapping), dataset: imp.dataset });
			$("imp-prev").innerHTML = '<div class="sb-card" style="padding:14px;margin-top:12px;background:var(--sb-bg);">' +
				'<b>' + r.plans + '</b> ' + (r.group_unit || "plans") + ', <b>' + r.total_rows + '</b> rows, <b style="color:' + (r.errors ? '#a23b2e' : 'var(--sb-green)') + ';">' + r.errors + '</b> error(s).' +
				(r.sample_errors.length ? '<ul>' + r.sample_errors.map(e => '<li class="sb-muted">' + esc(e) + '</li>').join("") + '</ul>' : '') +
				'<button class="sb-btn sb-btn--orange" id="imp-commit" style="margin-top:10px;"' + (r.errors ? "" : "") + '>Commit import</button></div>';
			$("imp-commit").onclick = commitImport;
		}
		async function commitImport() {
			const r = await api("sbx_wmslite.console_api.import_commit", { file_url: imp.file_url, mapping: JSON.stringify(imp.mapping), label: imp.file_name, file_name: imp.file_name, dataset: imp.dataset });
			imp.batch = r.batch; $("imp-prev").innerHTML = '<p class="sb-muted">Importing… (batch ' + esc(r.batch) + ')</p>';
			poll();
		}
		async function poll() {
			const s = await api("sbx_wmslite.console_api.get_import_status", { batch: imp.batch });
			if (s.done) {
				$("imp-prev").innerHTML = '<div class="sb-card" style="padding:14px;margin-top:12px;"><b>' + esc(s.status) + '</b> — ' + s.inserted + ' plan(s) imported, ' + s.errors + ' error(s).' +
					(s.error_report ? '<pre style="white-space:pre-wrap;font-size:12px;">' + esc(s.error_report) + '</pre>' : '') + '</div>';
			} else { setTimeout(poll, 1500); }
		}

		// ---------- users (WMS Manager) ----------
		let U = { assignable: [], is_sm: 0 };
		async function renderUsers(c) {
			c.innerHTML = '<div class="toolbar"><input id="u-q" placeholder="Search name or login…" />' +
				'<span class="spacer" style="flex:1;"></span>' +
				'<button class="sb-btn sb-btn--primary sb-btn--inline" id="u-add">+ Add user</button></div>' +
				'<div id="u-table"></div>';
			const load = async () => {
				const d = await api("sbx_wmslite.user_api.list_wms_users");
				U = { assignable: d.assignable_roles || [], is_sm: d.is_system_manager };
				const q = ($("u-q").value || "").toLowerCase();
				const rows = (d.users || []).filter((u) => !q ||
					(u.full_name || "").toLowerCase().includes(q) || u.name.toLowerCase().includes(q));
				$("u-table").innerHTML = '<table class="grid"><thead><tr><th>User</th><th>Login</th><th>Roles</th>' +
					'<th>Status</th><th>Last active</th><th>Actions</th></tr></thead><tbody>' +
					(rows.length ? rows.map((u) => {
						const roles = (u.roles || []).map((r) => '<span class="pill open" style="margin-right:4px;">' + esc(r) + '</span>').join("") ||
							'<span class="sb-muted">none</span>';
						const other = (u.other_roles || []).length
							? '<div class="sb-muted" style="font-size:11px;margin-top:3px;">+ ' + esc(u.other_roles.join(", ")) + '</div>' : '';
						const status = u.enabled
							? '<span class="pill done">Active</span>' : '<span class="pill canc">Disabled</span>';
						const actions = u.manageable
							? '<button class="sb-btn sb-btn--ghost sb-btn--inline" style="padding:5px 10px;font-size:11px;" data-roles="' + esc(u.name) + '">Roles</button> ' +
							  '<button class="sb-btn sb-btn--ghost sb-btn--inline" style="padding:5px 10px;font-size:11px;" data-pwd="' + esc(u.name) + '">Password</button> ' +
							  '<button class="sb-btn ' + (u.enabled ? 'sb-btn--orange' : 'sb-btn--primary') + ' sb-btn--inline" style="padding:5px 10px;font-size:11px;" data-en="' + esc(u.name) + '" data-to="' + (u.enabled ? 0 : 1) + '">' + (u.enabled ? 'Disable' : 'Enable') + '</button>'
							: '<span class="sb-muted" style="font-size:11px;">🔒 ' + esc(u.locked_reason || "Locked") + '</span>';
						return '<tr><td><b>' + esc(u.full_name) + '</b>' + other + '</td><td class="sb-muted">' + esc(u.name) + '</td>' +
							'<td>' + roles + '</td><td>' + status + '</td>' +
							'<td class="sb-muted" style="white-space:nowrap;">' + esc((u.last_active || "—").slice(0, 16)) + '</td>' +
							'<td style="white-space:nowrap;">' + actions + '</td></tr>';
					}).join("") : '<tr><td colspan="6" class="sb-muted">No WMS users yet — use “Add user”.</td></tr>') +
					'</tbody></table>';
				document.querySelectorAll("#u-table [data-roles]").forEach((b) => b.onclick = () => rolesDrawer(b.dataset.roles, rows.find((x) => x.name === b.dataset.roles)));
				document.querySelectorAll("#u-table [data-pwd]").forEach((b) => b.onclick = () => passwordDrawer(b.dataset.pwd));
				document.querySelectorAll("#u-table [data-en]").forEach((b) => b.onclick = async () => {
					const to = b.dataset.to === "1";
					if (!confirm((to ? "Enable " : "Disable ") + b.dataset.en + "?")) return;
					try { await api("sbx_wmslite.user_api.set_user_enabled", { user: b.dataset.en, enabled: to ? 1 : 0 }); load(); }
					catch (e) { alert(e.message); }
				});
			};
			$("u-q").oninput = () => { clearTimeout(window._uq); window._uq = setTimeout(load, 250); };
			$("u-add").onclick = () => addUserDrawer(load);
			window._uReload = load;
			load();
		}

		function roleChecks(selected) {
			const sel = new Set(selected || []);
			return U.assignable.map((r) =>
				'<label style="display:flex;gap:8px;align-items:center;margin:7px 0;font-size:14px;">' +
				'<input type="checkbox" data-role="' + esc(r) + '"' + (sel.has(r) ? " checked" : "") + ' /> ' + esc(r) + '</label>').join("");
		}
		const pickedRoles = () => Array.from(document.querySelectorAll("#drawer input[data-role]:checked")).map((i) => i.dataset.role);

		function addUserDrawer(onDone) {
			openDrawer(
				'<h2 class="sb-h1" style="margin:0 0 4px;">Add WMS user</h2>' +
				'<p class="sb-muted">Creates a login for a warehouse user and assigns their roles.</p>' +
				'<div style="display:grid;gap:10px;max-width:420px;margin-top:14px;">' +
				'<label style="font-size:12px;color:var(--sb-muted);">First name *<input id="nu-first" class="sb-input" style="width:100%;padding:9px 10px;border:1px solid var(--sb-line);border-radius:6px;" /></label>' +
				'<label style="font-size:12px;color:var(--sb-muted);">Last name<input id="nu-last" class="sb-input" style="width:100%;padding:9px 10px;border:1px solid var(--sb-line);border-radius:6px;" /></label>' +
				'<label style="font-size:12px;color:var(--sb-muted);">Login ID *<input id="nu-id" class="sb-input" placeholder="operator1@wms.local" style="width:100%;padding:9px 10px;border:1px solid var(--sb-line);border-radius:6px;" /></label>' +
				'<div class="sb-muted" style="font-size:11px;margin-top:-6px;">Workers without email can use a made-up ID like <b>operator1@wms.local</b> — no email is sent.</div>' +
				'<label style="font-size:12px;color:var(--sb-muted);">Mobile<input id="nu-mob" class="sb-input" style="width:100%;padding:9px 10px;border:1px solid var(--sb-line);border-radius:6px;" /></label>' +
				'<label style="font-size:12px;color:var(--sb-muted);">Initial password *<input id="nu-pwd" type="password" class="sb-input" style="width:100%;padding:9px 10px;border:1px solid var(--sb-line);border-radius:6px;" /></label>' +
				'<div class="sb-muted" style="font-size:11px;margin-top:-6px;">Share this with the worker — they can change it after logging in.</div>' +
				'<div><div class="sb-label" style="margin:6px 0 2px;">Roles *</div>' + roleChecks([]) + '</div>' +
				'</div>' +
				'<div class="row" style="display:flex;gap:8px;margin-top:18px;">' +
				'<button class="sb-btn sb-btn--ghost sb-btn--inline" onclick="closeDrawer()">Cancel</button>' +
				'<button class="sb-btn sb-btn--primary sb-btn--inline" id="nu-save">Create user</button></div>' +
				'<div id="nu-msg" style="margin-top:10px;"></div>'
			);
			$("nu-save").onclick = async () => {
				const btn = $("nu-save"); btn.disabled = true; btn.textContent = "Creating…";
				try {
					const r = await api("sbx_wmslite.user_api.create_wms_user", {
						user_id: $("nu-id").value, first_name: $("nu-first").value, last_name: $("nu-last").value,
						mobile_no: $("nu-mob").value, password: $("nu-pwd").value, roles: JSON.stringify(pickedRoles()),
					});
					closeDrawer(); if (onDone) onDone();
				} catch (e) {
					$("nu-msg").innerHTML = '<div style="color:#a23b2e;font-size:13px;">' + esc(e.message) + '</div>';
					btn.disabled = false; btn.textContent = "Create user";
				}
			};
		}

		function rolesDrawer(user, row) {
			openDrawer('<h2 class="sb-h1" style="margin:0 0 4px;">Roles</h2><p class="sb-muted">' + esc(user) + '</p>' +
				'<div style="margin-top:12px;max-width:420px;">' + roleChecks((row && row.roles) || []) + '</div>' +
				'<div class="row" style="display:flex;gap:8px;margin-top:18px;">' +
				'<button class="sb-btn sb-btn--ghost sb-btn--inline" onclick="closeDrawer()">Cancel</button>' +
				'<button class="sb-btn sb-btn--primary sb-btn--inline" id="ur-save">Save roles</button></div>' +
				'<div id="ur-msg" style="margin-top:10px;"></div>');
			$("ur-save").onclick = async () => {
				try { await api("sbx_wmslite.user_api.set_user_roles", { user: user, roles: JSON.stringify(pickedRoles()) });
					closeDrawer(); if (window._uReload) window._uReload(); }
				catch (e) { $("ur-msg").innerHTML = '<div style="color:#a23b2e;font-size:13px;">' + esc(e.message) + '</div>'; }
			};
		}

		function passwordDrawer(user) {
			openDrawer('<h2 class="sb-h1" style="margin:0 0 4px;">Reset password</h2><p class="sb-muted">' + esc(user) + '</p>' +
				'<label style="font-size:12px;color:var(--sb-muted);display:block;margin-top:14px;max-width:420px;">New password' +
				'<input id="up-pwd" type="password" class="sb-input" style="width:100%;padding:9px 10px;border:1px solid var(--sb-line);border-radius:6px;" /></label>' +
				'<div class="sb-muted" style="font-size:11px;margin-top:6px;">Share the new password with the user.</div>' +
				'<div class="row" style="display:flex;gap:8px;margin-top:18px;">' +
				'<button class="sb-btn sb-btn--ghost sb-btn--inline" onclick="closeDrawer()">Cancel</button>' +
				'<button class="sb-btn sb-btn--primary sb-btn--inline" id="up-save">Set password</button></div>' +
				'<div id="up-msg" style="margin-top:10px;"></div>');
			$("up-save").onclick = async () => {
				try { await api("sbx_wmslite.user_api.reset_user_password", { user: user, password: $("up-pwd").value });
					closeDrawer(); if (window._uReload) window._uReload(); }
				catch (e) { $("up-msg").innerHTML = '<div style="color:#a23b2e;font-size:13px;">' + esc(e.message) + '</div>'; }
			};
		}

		// ---------- drawer ----------
		function openDrawer(html) { $("drawer").innerHTML = html; $("drawer").classList.add("show"); $("scrim2").classList.add("show"); }
		function closeDrawer() { $("drawer").classList.remove("show"); $("scrim2").classList.remove("show"); }

		// ---------- sign out ----------
		// Frappe's built-in logout clears the session cookie; we send the CSRF token
		// because it is a state-changing POST. Redirect regardless of the outcome —
		// a failed call must not leave the user stuck on a console they can't use.
		$("logout").onclick = async () => {
			if (!confirm("Sign out of the WMS Core console?")) return;
			try {
				await fetch("/api/method/logout", {
					method: "POST", credentials: "same-origin",
					headers: { "X-Frappe-CSRF-Token": CSRF },
				});
			} catch (e) { /* offline or server error — redirect anyway */ }
			window.location.href = "/login";
		};

		renderNav(); render();
	</script>
</body>
</html>
